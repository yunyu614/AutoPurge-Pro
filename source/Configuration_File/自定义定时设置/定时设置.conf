# AutoPurge Pro 定时清理配置 (Author: liancan)
# 说明：
# 【Set_Mode】执行方式：daily=每天固定时间；interval=按间隔执行
# 【Set_Interval】间隔数值；【Set_Interval_Unit】单位 minute / hour / day
#   分钟 10-1440，小时 1-720，天 1-30
# 【Set_Time1】【Set_minute1】每天模式的小时【0-23】和分钟【0-59】
# 【Set_weekday1】星期【1-7】或 "*"（每天）
# 可通过 WebUI 界面直接可视化修改并立即生效，也可手动修改后执行 Timing_Settings.sh

# - 【执行方式】
Set_Mode=daily

# - 【间隔设置】仅 Set_Mode=interval 时生效
Set_Interval=6
Set_Interval_Unit=hour

# - 【每天时间】
Set_Time1=0
Set_minute1=00
Set_weekday1=*

# - 【兼容旧版字段】
Set_Time2=12
Set_minute2=00
Set_weekday2=*
