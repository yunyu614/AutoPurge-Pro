// AutoPurge Pro 全局配置文件 (Author: liancan)
// 以下开关填入true开启，填入false关闭

// 模块功能总开关 (控制后台守护与所有自动清理任务)
master_switch=true

// 是否启用定时清理
timed_cleaning=true

// 是否启用MT管理器清理
mt_cleaning=true

// 是否启用日志(Clear.log)清理
log_cleaning=true

// 日志清理大小(Clear.log) 可选 512K / 1M / 2M / 5M / 10M
log_purge_size=2M

// 独立开关：APK安装包清理
apk_cleaning=false

// 独立开关：已卸载模块残留清理
module_residue_cleaning=false

// 独立开关：多媒体与文件分类整理
file_organize=false

# 黑名单清理总开关
blacklist_cleaning=true
