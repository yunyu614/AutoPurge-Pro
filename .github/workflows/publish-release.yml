name: Publish AutoPurge Pro Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Publish validated immutable KernelSU module release
        uses: KernelSU-Modules/tools/actions/module-release@e72995777c079c0bb32c49cd6fccd2773ebb0987
        with:
          module-dir: source
          manifest: module.yaml
          release-notes-file: release-notes-v4.4.4.md
          require-immutable: true
